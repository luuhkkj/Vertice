x-backend-env: &backend-env
  PROJECT_NAME: ${PROJECT_NAME:-Vértice Backend API}
  VERSION: ${VERSION:-0.2.1}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-False}
  API_V1_STR: ${API_V1_STR:-/api/v1}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
  POSTGRES_SERVER: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-vertice}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz ou no ambiente}
  POSTGRES_DB: ${POSTGRES_DB:-vertice}
  SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY segura (>=32 chars) no arquivo .env da raiz ou no ambiente}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz ou no ambiente}
      POSTGRES_DB: ${POSTGRES_DB:-vertice}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - vertice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-vertice} -d $${POSTGRES_DB:-vertice}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data = json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()); assert data.get('status') == 'healthy'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: "./Frontend vertice"
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VERTICE_API_URL: ${VERTICE_API_URL:-http://backend:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); assert resp.status == 200",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vertice_postgres_data:
