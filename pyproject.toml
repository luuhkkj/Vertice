[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "backend/.venv",
    ".pytest_cache",
    ".ruff_cache",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
]
ignore = [
    # FastAPI utiliza Depends(), Query() e File() nos parâmetros de rotas/dependências
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Define DATABASE_URL de teste antes de importar módulos da aplicação
"backend/tests/conftest.py" = ["E402"]
# Ajustam sys.path antes dos imports internos de app.*
"backend/alembic/env.py" = ["E402"]
"backend/app/scripts/create_admin.py" = ["E402"]
